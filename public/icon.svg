<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131317" />
      <stop offset="100%" stop-color="#0a0a0c" />
    </linearGradient>
    <radialGradient id="coralGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8975" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ff8975" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Squircle -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="7" fill="url(#bgGrad)" stroke="#2e2e36" stroke-width="1" />

  <!-- Center subtle glow -->
  <circle cx="16" cy="16" r="11" fill="url(#coralGlow)" />

  <!-- Connecting graph lines -->
  <g stroke="#ff8975" stroke-opacity="0.8" stroke-width="1.5" stroke-linecap="round">
    <line x1="8" y1="9" x2="23" y2="23" />
    <line x1="24" y1="7" x2="10" y2="24" />
    <line x1="8" y1="9" x2="24" y2="7" />
  </g>

  <!-- Primary coral nodes -->
  <circle cx="8" cy="9" r="3" fill="#ff8975" />
  <circle cx="23" cy="23" r="3.4" fill="#ff8975" />

  <!-- Secondary light nodes -->
  <circle cx="24" cy="7" r="2.4" fill="#f5f5f7" />
  <circle cx="10" cy="24" r="2.2" fill="#f5f5f7" />
</svg>
